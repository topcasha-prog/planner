<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Планировщик целей</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--text:#e6e8ee;--muted:#8b93a7;--accent:#7c9cff;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--border:#262b36}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;height:100vh;overflow:hidden}
.app{display:grid;grid-template-columns:1fr 1fr;height:100vh}
.side{border-right:1px solid var(--border);overflow-y:auto;padding:14px;display:flex;flex-direction:column}
.chat-wrap{display:flex;flex-direction:column;height:100vh}
.chat{flex:1;overflow-y:auto;padding:16px}
.input-row{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px}
.input-row textarea{flex:1;resize:none;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px;font-family:inherit;font-size:14px;height:70px}
button{font-family:inherit;font-size:14px;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#0f1115;border-color:var(--accent);font-weight:600}
button.tiny{padding:2px 8px;font-size:12px}
h1{font-size:15px;margin:0 0 12px;font-weight:600}
h2{font-size:12px;margin:0 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.tabs{display:flex;gap:2px;margin-bottom:12px;border-bottom:1px solid var(--border);flex-shrink:0}
.tab{padding:8px 12px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
.goal{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px}
.goal-title{font-weight:600;font-size:14px;margin-bottom:4px}
.goal-meta{color:var(--muted);font-size:12px;margin-bottom:8px}
.bar{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-bottom:6px}
.bar-fill{height:100%;background:var(--accent);transition:width .3s}
.bar-fill.warn{background:var(--warn)}
.bar-fill.bad{background:var(--bad)}
.week{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px}
.week.now{border-color:var(--accent);background:#1a2030}
.week-head{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.week-head b{color:var(--text)}
.task{display:flex;align-items:flex-start;gap:8px;padding:4px 0;font-size:13px}
.task input{margin-top:3px}
.task.done .task-title{text-decoration:line-through;opacity:.5}
.task-title{flex:1}
.tag{font-size:11px;color:var(--muted);padding:1px 5px;background:var(--panel2);border-radius:3px}
.tag.S{color:#4ade80}.tag.M{color:#fbbf24}.tag.L{color:#f87171}
.tag.overdue{color:var(--bad);background:#3a1a1a}
.msg{margin-bottom:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.msg.user{background:var(--panel2);padding:10px 12px;border-radius:8px;margin-left:40px}
.msg .role{font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.empty{color:var(--muted);font-style:italic;font-size:13px;padding:20px;text-align:center}
.settings{margin-bottom:12px;padding:8px;background:var(--panel);border-radius:6px;font-size:11px;flex-shrink:0}
.settings input,.settings select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:5px;margin-top:4px;font-size:11px}
.settings summary{cursor:pointer;color:var(--muted);user-select:none;padding:2px 0}
.report{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px;font-size:13px}
.report-head{display:flex;justify-content:space-between;margin-bottom:6px}
.score{font-weight:700;font-size:16px}
.score.good{color:var(--ok)}.score.mid{color:var(--warn)}.score.bad{color:var(--bad)}
.summary{color:var(--muted);font-size:12px;margin-top:6px;white-space:pre-wrap}
.report-btn{width:100%;margin-bottom:10px}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{max-height:50vh}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <h1>🎯 План</h1>
    <details class="settings">
      <summary>⚙️ Настройки API</summary>
      <input id="apiKey" type="password" placeholder="sk-...">
      <select id="provider">
        <option value="openrouter">OpenRouter (бесплатные модели)</option>
        <option value="deepseek">DeepSeek (платно, копейки)</option>
        <option value="openai">OpenAI</option>
      </select>
      <select id="model"></select>
    </details>
    <div class="tabs">
      <button class="tab active" data-tab="goals">Цели</button>
      <button class="tab" data-tab="plan">План</button>
      <button class="tab" data-tab="reports">Отчёты</button>
    </div>
    <div id="content"></div>
  </aside>
  <div class="chat-wrap">
    <div class="chat" id="chat"></div>
    <div class="input-row">
      <textarea id="userInput" placeholder="Например: добавь цель — ремонт до 31 января, или: составь отчёт за неделю, или: добавь врача-дерматолога до 20 ноября (Ctrl+Enter)"></textarea>
      <button class="primary" onclick="send()">→</button>
    </div>
  </div>
</div>
<script>
const MODELS = {
  openrouter: ['qwen/qwen3.6-plus:free','meta-llama/llama-3.3-70b-instruct:free','nvidia/nemotron-3-super-120b-a12b:free','openai/gpt-oss-120b:free'],
  deepseek: ['deepseek-chat','deepseek-reasoner'],
  openai: ['gpt-4o-mini','gpt-4o']
};
const ENDPOINTS = {
  openrouter: 'https://openrouter.ai/api/v1/chat/completions',
  deepseek: 'https://api.deepseek.com/chat/completions',
  openai: 'https://api.openai.com/v1/chat/completions'
};
const EFFORT_HOURS = {S:2, M:6, L:20};

let state = load() || {
  goals: [], reports: [], messages: [],
  apiKey: '', provider: 'openrouter', model: MODELS.openrouter[0],
  tab: 'goals'
};

function load(){ try{return JSON.parse(localStorage.getItem('goals_v2'))}catch(e){return null} }
function save(){ localStorage.setItem('goals_v2', JSON.stringify(state)) }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }
function uid(){ return Math.random().toString(36).slice(2,9) }

// date helpers
function startOfWeek(d){
  const x = new Date(d); const day = x.getDay();
  const diff = day===0 ? -6 : 1-day;
  x.setDate(x.getDate()+diff); x.setHours(0,0,0,0); return x;
}
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function fmtShort(d){ return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'}); }
function fmtISO(d){ return d.toISOString().slice(0,10); }
function todayISO(){ return fmtISO(new Date()); }
function daysBetween(a,b){ return Math.round((b-a)/(24*3600*1000)); }

function currentWeekIndex(){
  // week 0 = текущая неделя
  return 0;
}

function weekRange(wIdx){
  const s = addDays(startOfWeek(new Date()), wIdx*7);
  return {start: s, end: addDays(s,6)};
}
function weekLabel(wIdx){
  const {start,end} = weekRange(wIdx);
  const y = start.getFullYear();
  return `${fmtShort(start)} – ${fmtShort(end)} ${y}`;
}
function weekOffsetForDate(iso){
  const d = new Date(iso); if(isNaN(d)) return null;
  const diff = daysBetween(startOfWeek(new Date()), startOfWeek(d));
  return Math.round(diff/7);
}

function allTasks(){
  const out = [];
  state.goals.forEach(g => (g.tasks||[]).forEach(t => out.push({...t, goalId:g.id, goalTitle:g.title})));
  return out;
}
function goalProgress(g){
  const tasks = g.tasks||[];
  if(!tasks.length) return 0;
  const done = tasks.filter(t=>t.done).length;
  return Math.round(done/tasks.length*100);
}

// ====== RENDER ======
function render(){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===state.tab));
  const c = document.getElementById('content');
  if(state.tab==='goals') c.innerHTML = renderGoals();
  else if(state.tab==='plan') c.innerHTML = renderPlan();
  else c.innerHTML = renderReports();
  renderChat();
}

function renderGoals(){
  if(!state.goals.length){
    return '<div class="empty">Пока целей нет. Опиши их в чате — например:<br><br>"Хочу к новому году: бизнес 70к/мес, диспансеризацию и ремонт. Сегодня 16 октября."</div>';
  }
  return state.goals.map((g,gi)=>{
    const pct = goalProgress(g);
    const totalT = (g.tasks||[]).length;
    const doneT = (g.tasks||[]).filter(t=>t.done).length;
    const cls = pct>=70?'':pct>=40?'warn':'bad';
    const dl = g.deadline ? new Date(g.deadline) : null;
    const dlStr = dl && !isNaN(dl) ? 'до '+dl.toLocaleDateString('ru-RU',{day:'numeric',month:'long'}) : '';
    const daysLeft = dl ? daysBetween(new Date(), dl) : null;
    const leftStr = daysLeft!==null ? (daysLeft>0 ? daysLeft+' дн.' : 'просрочено') : '';
    return `<div class="goal">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div style="flex:1">
          <div class="goal-title">${esc(g.title)}</div>
          <div class="goal-meta">${dlStr}${leftStr?' · '+leftStr:''} · ${doneT}/${totalT} задач</div>
        </div>
        <button class="tiny" onclick="deleteGoal(${gi})" title="Удалить">✕</button>
      </div>
      <div class="bar"><div class="bar-fill ${cls}" style="width:${pct}%"></div></div>
      <div style="font-size:12px;color:var(--muted)">${pct}% готово</div>
    </div>`;
  }).join('');
}

function renderPlan(){
  const tasks = allTasks();
  if(!tasks.length) return '<div class="empty">Плана пока нет — сначала опиши цели в чате.</div>';
  // group by week
  const byWeek = {};
  tasks.forEach(t=>{
    const w = t.week != null ? t.week : 0;
    (byWeek[w] = byWeek[w]||[]).push(t);
  });
  const weeks = Object.keys(byWeek).map(Number).sort((a,b)=>a-b);
  return weeks.map(w=>{
    const {start,end} = weekRange(w);
    const isNow = w === currentWeekIndex();
    const isPast = w < currentWeekIndex();
    const list = byWeek[w].slice().sort((a,b)=>a.done-b.done || (b.impact||0)-(a.impact||0));
    const hours = list.filter(t=>!t.done).reduce((s,t)=>s+(EFFORT_HOURS[t.effort]||0),0);
    const doneCount = list.filter(t=>t.done).length;
    return `<div class="week ${isNow?'now':''}">
      <div class="week-head">
        <span>${isNow?'<b>Сейчас · </b>':''}${weekLabel(w)}</span>
        <span>${doneCount}/${list.length} · ~${hours}ч осталось</span>
      </div>
      ${list.map(t=>{
        const overdue = isPast && !t.done;
        return `<label class="task ${t.done?'done':''}">
          <input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.goalId}','${t.id}')">
          <span class="task-title">${esc(t.title)}</span>
          <span class="tag ${t.effort||''}">${t.effort||'?'}</span>
          ${overdue?'<span class="tag overdue">просрочено</span>':''}
          <span class="tag" title="${esc(t.goalTitle)}" style="max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.goalTitle.slice(0,12))}</span>
        </label>`;
      }).join('')}
    </div>`;
  }).join('');
}

function renderReports(){
  const btn = `<button class="primary report-btn" onclick="askForReport()">📊 Составить отчёт за прошедшую неделю</button>`;
  if(!state.reports || !state.reports.length){
    return btn + '<div class="empty">Отчётов пока нет. Нажми кнопку — ассистент посчитает.</div>';
  }
  return btn + state.reports.slice().reverse().map(r=>{
    const cls = r.score>=7?'good':r.score>=4?'mid':'bad';
    return `<div class="report">
      <div class="report-head">
        <span>${esc(r.weekStart)} – ${esc(r.weekEnd)}</span>
        <span class="score ${cls}">${r.score}/10</span>
      </div>
      <div style="font-size:12px;color:var(--muted)">Сделано ${r.done} из ${r.planned} задач (${Math.round(r.done/Math.max(1,r.planned)*100)}%)</div>
      ${r.summary?`<div class="summary">${esc(r.summary)}</div>`:''}
    </div>`;
  }).join('');
}

function renderChat(){
  const el = document.getElementById('chat');
  if(!state.messages.length){
    el.innerHTML = '<div class="empty">Привет! Опиши цели так, как они у тебя в голове. Например:<br><br>"Сегодня 16 октября. К новому году хочу: 1) бизнес приносит 70к/мес (сейчас 25к), 2) пройти диспансеризацию, 3) сделать ремонт в спальне. Раскидай по неделям."</div>';
    return;
  }
  el.innerHTML = state.messages.map(m=>{
    const text = m.content.replace(/```json[\s\S]*?```/g,'').trim();
    return `<div class="msg ${m.role}"><div class="role">${m.role==='user'?'ты':'ассистент'}</div>${esc(text)}</div>`;
  }).join('');
  el.scrollTop = el.scrollHeight;
}
function showThinking(on){
  const el = document.getElementById('chat');
  if(on) el.innerHTML += '<div class="msg"><div class="role">ассистент</div>…думает</div>';
  else renderChat();
}

// ====== ACTIONS ======
function toggleTask(goalId, taskId){
  const g = state.goals.find(x=>x.id===goalId);
  if(!g) return;
  const t = (g.tasks||[]).find(x=>x.id===taskId);
  if(t){ t.done = !t.done; save(); render(); }
}
function deleteGoal(gi){
  if(!confirm('Удалить цель со всеми задачами?')) return;
  state.goals.splice(gi,1); save(); render();
}
function askForReport(){
  document.getElementById('userInput').value = 'Составь отчёт за прошедшую неделю: сколько задач было запланировано, сколько сделано, оцени меня по 10-балльной шкале и скажи, что подтянуть.';
  send();
}

// ====== AI ======
function buildSystemPrompt(){
  const today = new Date();
  const todayStr = today.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
  return `Ты — персональный планировщик. Сегодня ${todayStr} (${todayISO()}).

ЗАДАЧА: помогать пользователю достичь нескольких целей к дедлайнам. Ты сам раскладываешь работу по неделям и сам корректируешь план, когда появляются новые обстоятельства.

ПРАВИЛА:
1. НЕ заваливай анкетой. Если пользователь дал цели — сразу строй план. Уточняющие вопросы задавай по 1-2, только если без них план будет фантазией.
2. На каждую цель — 5-15 конкретных задач. Формулируй так, чтобы было понятно, что делать ("позвонить в поликлинику и записаться к терапевту", а не "заняться здоровьем").
3. Оценивай каждую задачу:
   - effort: S (до 2ч), M (до 6ч), L (до 20ч, требует нескольких подходов)
   - impact: 1-5, насколько задача приближает к цели
4. Раскидывай по неделям. week=0 — текущая неделя, week=1 — следующая, и т.д.
   - Нагрузка: не больше 12-15 часов в неделю на всё.
   - В неделю от дедлайна отсчитывай так, чтобы всё успело закрыться с запасом 1-2 недели.
   - Задачи с высоким impact — раньше. Задачи с L-effort — в начало недели, чтобы был запас.
5. Когда пользователь сообщает о новых обстоятельствах ("появился новый врач", "сдвинулся дедлайн") — пересобери план: вставь новые задачи, сдвинь менее важные на следующие недели, но не раздувай нагрузку.
6. Когда пользователь отмечает задачу галочкой — не надо пересобирать план, просто коротко ответь.
7. Отчёт за неделю: считаешь задачи у которых week = прошедшая неделя. done — сделано, planned — всего. score = round(done/planned * 10). В summary: 2-3 предложения — где просел, что подтянуть. Добавляй отчёт в массив reports.
8. Будь краток. Максимум 4-5 предложений обычного текста. Ты не лектор.

ФОРМАТ ОТВЕТА:
- Сначала обычный текст: что сделал (2-4 предложения).
- Затем В КОНЦЕ блок:
\`\`\`json
{"goals": [...], "reports": [...]}
\`\`\`
Это ПОЛНОЕ состояние, а не патч. Если goals/reports не менялись — не добавляй JSON вообще.

СТРУКТУРА JSON:
{
  "goals": [
    {"id":"g1","title":"Бизнес 70к/мес","deadline":"2026-12-31","created":"2026-10-16",
     "tasks":[
       {"id":"t1","title":"...","effort":"S","impact":4,"week":0,"done":false}
     ]}
  ],
  "reports": [
    {"weekStart":"2026-10-14","weekEnd":"2026-10-20","score":7,"done":5,"planned":8,"summary":"..."}
  ]
}

ТЕКУЩЕЕ СОСТОЯНИЕ:
${JSON.stringify({goals: state.goals, reports: state.reports})}`;
}

async function callAI(){
  const url = ENDPOINTS[state.provider];
  const headers = {'Content-Type':'application/json','Authorization':'Bearer '+state.apiKey};
  if(state.provider==='openrouter'){ headers['HTTP-Referer']='https://github.com'; headers['X-Title']='Goal Planner'; }
  const body = {
    model: state.model,
    messages: [{role:'system', content: buildSystemPrompt()}, ...state.messages.slice(-20)]
  };
  const res = await fetch(url, {method:'POST', headers, body: JSON.stringify(body)});
  if(!res.ok){ const t = await res.text(); throw new Error('API '+res.status+': '+t.slice(0,300)); }
  const data = await res.json();
  return data.choices[0].message.content;
}

function parseJSONBlock(text){
  const m = text.match(/```json\s*([\s\S]*?)```/);
  if(!m) return null;
  try { return JSON.parse(m[1]); }
  catch(e){
    try { return JSON.parse(m[1].replace(/,(\s*[}\]])/g,'$1')); }
    catch(e2){ return null; }
  }
}

async function send(){
  if(!state.apiKey){ alert('Вставь API-ключ в настройках сверху слева'); return; }
  const ta = document.getElementById('userInput');
  const txt = ta.value.trim();
  if(!txt) return;
  ta.value = '';
  state.messages.push({role:'user', content: txt});
  save(); render(); showThinking(true);
  try {
    const reply = await callAI();
    state.messages.push({role:'assistant', content: reply});
    const parsed = parseJSONBlock(reply);
    if(parsed){
      if(parsed.goals) state.goals = parsed.goals;
      if(parsed.reports) state.reports = parsed.reports;
    }
    save(); render();
  } catch(e){
    state.messages.push({role:'assistant', content:'⚠️ Ошибка: '+e.message});
    save(); render();
  } finally {
    showThinking(false);
  }
}

// ====== SETTINGS ======
function bindSettings(){
  const k = document.getElementById('apiKey');
  const p = document.getElementById('provider');
  const m = document.getElementById('model');
  k.value = state.apiKey;
  p.value = state.provider;
  function fillModels(){
    if(!MODELS[state.provider].includes(state.model)) state.model = MODELS[state.provider][0];
    m.innerHTML = MODELS[state.provider].map(x=>`<option ${state.model===x?'selected':''}>${x}</option>`).join('');
  }
  fillModels();
  k.oninput = ()=>{ state.apiKey = k.value.trim(); save(); };
  p.onchange = ()=>{ state.provider = p.value; state.model = MODELS[p.value][0]; save(); fillModels(); };
  m.onchange = ()=>{ state.model = m.value; save(); };
}

document.querySelectorAll('.tab').forEach(t=>{
  t.onclick = ()=>{ state.tab = t.dataset.tab; save(); render(); };
});
document.addEventListener('keydown', e=>{
  if(e.ctrlKey && e.key==='Enter' && document.activeElement.id==='userInput'){ e.preventDefault(); send(); }
});

bindSettings();
render();
</script>
</body>
</html>
